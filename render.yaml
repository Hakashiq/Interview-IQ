services:
  # AI Service (FastAPI)
  - type: web
    name: interviewiq-ai
    runtime: docker
    dockerfilePath: ai-service/Dockerfile
    dockerContext: ai-service
    plan: free
    numInstances: 1
    envVars:
      - key: GEMINI_API_KEY
        value: AIzaSyAZJfGqRUCq2voHvGDgMSuH__UNUgtvwQI

  # Backend Service (Spring Boot)
  - type: web
    name: interviewiq-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    numInstances: 1
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://kafka-25e0c3e7-thakashiq-268.d.aivencloud.com:26919/defaultdb?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: root
      - key: SPRING_DATASOURCE_PASSWORD
        value: root123
      - key: AI_SERVICE_URL
        value: http://interviewiq-ai:8000

  # Frontend Static Site (React + Vite)
  - type: web
    name: interviewiq-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
