server:
  port: 8080

spring:
  application:
    name: interviewiq-backend

  datasource:
    url: jdbc:mysql://localhost:3306/interviewiq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  threads:
    virtual:
      enabled: true

# JWT Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A7134743777217A25432A46
    access-token-expiration: 86400000    # 24 hours
    refresh-token-expiration: 604800000  # 7 days

  ai-service:
    url: http://localhost:8000

  upload:
    dir: ./uploads
    resume-dir: ./uploads/resumes
    audio-dir: ./uploads/audio

  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

logging:
  level:
    com.interviewiq: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
