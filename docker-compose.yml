version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: interviewiq-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: interviewiq
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - interviewiq-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: interviewiq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - interviewiq-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: interviewiq-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai-service
      - frontend
    networks:
      - interviewiq-net

  backend:
    build: ./backend
    container_name: interviewiq-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/interviewiq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123
      SPRING_REDIS_HOST: redis
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - interviewiq-net

  ai-service:
    build: ./ai-service
    container_name: interviewiq-ai
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    networks:
      - interviewiq-net

  frontend:
    build: ./frontend
    container_name: interviewiq-frontend
    ports:
      - "5173:5173"
    networks:
      - interviewiq-net

volumes:
  mysql_data:
  redis_data:

networks:
  interviewiq-net:
    driver: bridge
